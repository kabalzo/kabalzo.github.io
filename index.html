	<style>
		.movie-sort-bar {
			display: flex;
			flex-wrap: wrap;
			align-items: center;
			justify-content: center;
			gap: 10px;
			margin: 16px auto;
			padding: 12px 16px;
			max-width: 600px;
			background-color: #333;
			color: #ccc;
			border-radius: 6px;
		}
		.movie-sort-bar label {
			font-weight: bold;
		}
		.movie-sort-bar select {
			background-color: #222;
			color: #ccc;
			border: 1px solid #555;
			border-radius: 4px;
			padding: 5px 8px;
			font-size: 14px;
		}
		.movie-meta {
			display: grid;
			grid-template-columns: 1fr 1fr 1fr;
			align-items: center;
			margin: 4px 0 8px;
		}
		.movie-meta-year,
		.movie-meta-rated {
			color: #ccc;
			font-size: 14px;
			font-weight: bold;
			text-align: center;
		}
		.movie-meta-badge-slot {
			display: flex;
			justify-content: center;
		}
		.nic-badge {
			height: 32px;
			width: 32px;
			flex-shrink: 0;
		}
		.movie.movie-milestone {
			border: 3px solid #ffd700;
			box-shadow: 0 0 24px rgba(255, 215, 0, 0.55), inset 0 0 24px rgba(255, 215, 0, 0.06);
			background: linear-gradient(135deg, rgba(70, 55, 10, 0.45) 0%, rgba(26, 26, 26, 0.3) 100%);
			padding-top: 46px;
		}
		.milestone-banner {
			position: absolute;
			top: -14px;
			left: 50%;
			transform: translateX(-50%);
			background: linear-gradient(90deg, #b8860b 0%, #ffd700 50%, #b8860b 100%);
			color: #1a1a1a;
			font-weight: bold;
			font-size: 13px;
			letter-spacing: 1px;
			text-transform: uppercase;

			border-radius: 20px;
			border: 2px solid #1a1a1a;
			box-shadow: 0 3px 8px rgba(0,0,0,0.5);
			white-space: nowrap;
			z-index: 5;
		}

    <script>
        // ---- Movie Boys: render everything from movieboys.db ----

        // Fixed rater display order: [db column(s), display label]
        // "alexd" and "other" are mutually exclusive in the data and both
        // represent the same second Alex, so they share one label.
        const RATER_COLUMNS = [
            { cols: ['tyler'], label: 'Tyler' },
            { cols: ['alexb'], label: 'Alex' },
            { cols: ['trevor'], label: 'Trevor' },
            { cols: ['jordan'], label: 'Jordan' },
            { cols: ['drew'], label: 'Drew' },
            { cols: ['colin'], label: 'Colin' },
            { cols: ['alexd', 'other'], label: 'Other Alex' },
        ];

        function padDate(rawDate) {
            // db stores dates like "4/13/2020" -> render as "04/13/2020"
            if (!rawDate) return '';
            const parts = rawDate.split('/');
            if (parts.length !== 3) return rawDate;
            const [m, d, y] = parts;
            return `${m.padStart(2, '0')}/${d.padStart(2, '0')}/${y}`;
        }

        function buildMovieCard(row) {
            const movie = document.createElement('div');
            movie.className = 'movie';
            movie.id = row.id;
            if (row.imdb_id) movie.dataset.imdbId = row.imdb_id;
            movie.dataset.year = row.year || '';
            movie.dataset.nic = (row.nic || '').trim().toUpperCase();

            // Golden banner for milestone movies
            const MILESTONE_LABELS = { '100': '★ Movie #100 ★', '200': '★ Movie #200 ★' };
            if (MILESTONE_LABELS[row.id]) {
                movie.classList.add('movie-milestone');
                const banner = document.createElement('div');
                banner.className = 'milestone-banner';
                banner.textContent = MILESTONE_LABELS[row.id];
                movie.appendChild(banner);
            }

            // rating-box
            const ratingBox = document.createElement('div');
            ratingBox.className = 'rating-box';

            const titleDiv = document.createElement('div');
            titleDiv.className = 'movie-title';
            const h3 = document.createElement('h3');
            h3.textContent = row.title;
            titleDiv.appendChild(h3);
            ratingBox.appendChild(titleDiv);

            const metaDiv = document.createElement('div');
            metaDiv.className = 'movie-meta';

            const yearSpan = document.createElement('span');
            yearSpan.className = 'movie-meta-year';
            yearSpan.textContent = row.year || '';
            metaDiv.appendChild(yearSpan);

            const ratedSpan = document.createElement('span');
            ratedSpan.className = 'movie-meta-rated';
            ratedSpan.textContent = row.rated || '';
            metaDiv.appendChild(ratedSpan);

            const badgeSlot = document.createElement('span');
            badgeSlot.className = 'movie-meta-badge-slot';
            if (movie.dataset.nic === 'Y') {
                const nicBadge = document.createElement('img');
                nicBadge.className = 'nic-badge';
                nicBadge.src = './images/movie-nic.png';
                nicBadge.alt = 'Nic Cage Movie';
                nicBadge.title = 'Nic Cage Movie';
                badgeSlot.appendChild(nicBadge);
            }
            metaDiv.appendChild(badgeSlot);

            ratingBox.appendChild(metaDiv);

            const ratingsDiv = document.createElement('div');
            ratingsDiv.className = 'member-ratings';
            const ul = document.createElement('ul');
            for (const rater of RATER_COLUMNS) {
                let value = '';
                for (const col of rater.cols) {
                    const v = (row[col] || '').trim();
                    if (v) { value = v; break; }
                }
                if (!value) continue;
                const li = document.createElement('li');
                li.textContent = `${value}/5 - ${rater.label}`;
                ul.appendChild(li);
            }
            ratingsDiv.appendChild(ul);
            ratingBox.appendChild(ratingsDiv);

            const watchDateDiv = document.createElement('div');
            watchDateDiv.className = 'watch-date';
            const h5 = document.createElement('h5');
            h5.textContent = `${padDate(row.date)} - #${row.id}`;
            watchDateDiv.appendChild(h5);
            ratingBox.appendChild(watchDateDiv);

            movie.appendChild(ratingBox);

            // rt (rotten tomatoes link + poster image)
            const rtDiv = document.createElement('div');
            rtDiv.className = 'rt';
            const a = document.createElement('a');
            a.href = row.rt_url || '#';
            const img = document.createElement('img');
            img.src = row.image_file ? `./images/${row.image_file}` : '';
            img.alt = row.title;
            a.appendChild(img);
            rtDiv.appendChild(a);
            movie.appendChild(rtDiv);

            // synopsis
            const synDiv = document.createElement('div');
            synDiv.className = 'synopsis';
            const synP = document.createElement('p');
            synP.textContent = row.synopsis && row.synopsis.trim() ? row.synopsis.trim() : '...';
            synDiv.appendChild(synP);
            movie.appendChild(synDiv);

            // imdb (left empty for get-ratings.js to populate)
            const imdbDiv = document.createElement('div');
            imdbDiv.className = 'imdb';
            imdbDiv.appendChild(document.createElement('p'));
            movie.appendChild(imdbDiv);

            return movie;
        }

        async function loadMoviesFromDb() {
            const SQL = await initSqlJs({
                locateFile: file => `https://cdn.jsdelivr.net/npm/sql.js@1.10.3/dist/${file}`
            });
            const response = await fetch('./movieboys.db');
            const buffer = await response.arrayBuffer();
            const db = new SQL.Database(new Uint8Array(buffer));

            const result = db.exec(`
                SELECT id, title, tyler, alexb, trevor, jordan, drew, colin, alexd, other,
                       date, year, nic, rated, pick, image_file, rt_url, imdb_id, synopsis
                FROM movies
                ORDER BY CAST(id AS INTEGER) ASC
            `);
            db.close();

            if (!result.length) return [];
            const { columns, values } = result[0];
            return values.map(rowArr => {
                const row = {};
                columns.forEach((col, i) => { row[col] = rowArr[i]; });
                return row;
            });
        }

        async function renderMovies() {
            const container = document.getElementById('movie-container');
            try {
                const movies = await loadMoviesFromDb();
                const fragment = document.createDocumentFragment();
                movies.forEach(row => fragment.appendChild(buildMovieCard(row)));
                container.appendChild(fragment);
                shrinkLongTitles();
            } catch (err) {
                console.error('Failed to load movieboys.db:', err);
                const errDiv = document.createElement('p');
                errDiv.style.textAlign = 'center';
                errDiv.textContent = 'Could not load movie data.';
                container.appendChild(errDiv);
            }
        }

        // .rating-box has a fixed height and .member-ratings is overflow:hidden, so a
        // long title wrapping to 2 lines eats into the space the ratings list needs and
        // the bottom rows get clipped. Shrink just that title's font until it fits on one
        // line (down to a readable floor), so the ratings list always keeps its full space.
        const MOVIE_TITLE_MAX_FONT_SIZE = 14; // matches .movie-title CSS
        const MOVIE_TITLE_MIN_FONT_SIZE = 9;
        function shrinkLongTitles() {
            document.querySelectorAll('.movie-title h3').forEach(h3 => {
                let fontSize = MOVIE_TITLE_MAX_FONT_SIZE;
                h3.style.fontSize = fontSize + 'px';
                // Force single-line temporarily so we can measure whether the text
                // actually overflows the available width at this font size.
                h3.style.whiteSpace = 'nowrap';
                while (fontSize > MOVIE_TITLE_MIN_FONT_SIZE && h3.scrollWidth > h3.clientWidth) {
                    fontSize -= 1;
                    h3.style.fontSize = fontSize + 'px';
                }
                // Restore normal wrapping — at the floor size, extremely long titles may
                // still wrap to 2 lines, but that's much less costly at the smaller size.
                h3.style.whiteSpace = '';
            });
        }

        // ---- Sorting ----

        // Sensible default direction when the field itself changes.
        const DEFAULT_SORT_DIRECTIONS = {
            id: 'asc',
            rating: 'desc',
            consensus: 'desc',
            year: 'desc',
            nic: 'desc'
        };

        // Movie Boys Rating / Consensus % are computed by movieboys-rating.js
        // straight from the ratings already in the DOM, so sorting by them
        // doesn't require the visible rating widget to have rendered yet.
        function getSortValue(movieEl, field) {
            switch (field) {
                case 'year':
                    return parseInt(movieEl.dataset.year, 10) || 0;
                case 'nic':
                    return movieEl.dataset.nic === 'Y' ? 1 : 0;
                case 'rating': {
                    const metrics = (typeof calculateMovieRating === 'function') ? calculateMovieRating(movieEl) : null;
                    return metrics ? parseFloat(metrics.raw) : -1;
                }
                case 'consensus': {
                    const metrics = (typeof calculateMovieRating === 'function') ? calculateMovieRating(movieEl) : null;
                    return metrics ? metrics.consensus : -1;
                }
                case 'id':
                default:
                    return parseInt(movieEl.id, 10) || 0;
            }
        }

        function sortMovies() {
            const container = document.getElementById('movie-container');
            const fieldSelect = document.getElementById('movie-sort-field');
            const directionSelect = document.getElementById('movie-sort-direction');
            if (!container || !fieldSelect || !directionSelect) return;

            const field = fieldSelect.value;
            const direction = directionSelect.value;

            // The id="0" tile is an empty layout placeholder, not a real movie — leave it pinned first.
            const cards = Array.from(container.querySelectorAll('.movie')).filter(el => el.id !== '0');

            cards.sort((a, b) => {
                const va = getSortValue(a, field);
                const vb = getSortValue(b, field);
                if (va === vb) {
                    // Stable tie-break so equal scores don't jump around.
                    return (parseInt(a.id, 10) || 0) - (parseInt(b.id, 10) || 0);
                }
                return direction === 'asc' ? va - vb : vb - va;
            });

            // The container is styled with flex-direction: column-reverse (so the
            // newest movie shows first by default) — reverse the sorted array before
            // appending, or the "top of page" would show the opposite of what was picked.
            cards.reverse();

            cards.forEach(card => container.appendChild(card));

            try {
                localStorage.setItem('movieboys_sort_field', field);
                localStorage.setItem('movieboys_sort_direction', direction);
            } catch (e) {
                // ignore storage errors (private browsing, etc.)
            }
        }

        function initSortControls() {
            const fieldSelect = document.getElementById('movie-sort-field');
            const directionSelect = document.getElementById('movie-sort-direction');
            if (!fieldSelect || !directionSelect) return;

            // Restore last-used sort, defaulting to id/asc (the original watch order).
            let savedField = 'id';
            let savedDirection = 'asc';
            try {
                savedField = localStorage.getItem('movieboys_sort_field') || savedField;
                savedDirection = localStorage.getItem('movieboys_sort_direction') || savedDirection;
            } catch (e) {
                // ignore storage errors
            }
            fieldSelect.value = savedField;
            directionSelect.value = savedDirection;
            if (savedField !== 'id' || savedDirection !== 'asc') {
                sortMovies();
            }

            fieldSelect.addEventListener('change', function() {
                directionSelect.value = DEFAULT_SORT_DIRECTIONS[fieldSelect.value] || 'asc';
                sortMovies();
            });
            directionSelect.addEventListener('change', sortMovies);
        }

        // Initialize ratings when page loads
        document.addEventListener('DOMContentLoaded', async function() {
            await renderMovies();
            initSortControls();

            // These run only after the movie cards actually exist in the DOM.
            // (initAllMovieBoysRatings comes from movieboys-rating.js; loadAllMovieRatings
            // comes from get-ratings.js — both normally run on their own DOMContentLoaded
            // listeners, but those fire before our db-driven cards exist, so we call
            // them ourselves once rendering is actually done.)
            if (typeof initAllMovieBoysRatings === 'function') {
                initAllMovieBoysRatings();
            }
            if (typeof loadAllMovieRatings === 'function') {
                loadAllMovieRatings();
            }

            // Initialize back to top button
            initBackToTopButton();
        });

        // Back to Top Button Functionality
        function initBackToTopButton() {
            const backToTopBtn = document.getElementById('backToTopBtn');

            // Show button when user scrolls down 300px from the top
            window.addEventListener('scroll', function() {
                if (window.pageYOffset > 300) {
                    backToTopBtn.classList.add('show');
                } else {
                    backToTopBtn.classList.remove('show');
                }
            });

            // Smooth scroll to top when button is clicked
            backToTopBtn.addEventListener('click', function() {
                window.scrollTo({
                    top: 0,
                    behavior: 'smooth'
                });
            });
        }
    </script>
